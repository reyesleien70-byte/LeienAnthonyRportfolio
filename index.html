<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F9FA">
<meta name="color-scheme" content="light">
<!-- These two are a fallback only. The live ones come from content.js -->
<title>Leien · Email &amp; automation for Shopify brands</title>
<meta name="description" content="Klaviyo lifecycle email and n8n automation for Shopify and DTC brands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="style.css">
<!-- page-to-page fades are the browser's own. IF one is skipped (e.g. the tab is hidden)
     THEN the page simply shows. This must run before the first paint, SO it lives here. -->
<script>
["pageswap","pagereveal"].forEach(function(t){addEventListener(t,function(e){var v=e.viewTransition;if(v){v.ready.catch(function(){});v.finished.catch(function(){});}});});
</script>
<!-- smooth scrolling for a mouse OR trackpad. IF it fails to load THEN the page scrolls normally. -->
<script async id="lenis-lib" src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
</head>
<body>

<!-- ============================================================
     THIS FILE HOLDS NO WORDS AND NO PICTURES.
     It is the frame only. Everything you can read on this page
     comes from content.js. Edit that file.
     ============================================================ -->

<!-- ============ THE SKY ============ -->
<div class="sky" aria-hidden="true">
  <div class="aurora aurora--1"></div>
  <div class="aurora aurora--2"></div>
  <div class="aurora aurora--3"></div>
  <canvas id="stars"></canvas>
</div>

<!-- ============ HEADER ============ -->
<header class="nav">

    <div class="portrait__ring"></div>

  <div class="stream" id="home-blocks"></div>

    <div class="noscript">This site needs JavaScript switched on.</div>

</main>

<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
